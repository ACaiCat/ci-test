name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: TEST
        uses: ACaiCat/huawei-appgallery-deploy@v1.7.0
        with:
          credentials:  ${{secrets.HUAWEI_CREDENTIALS}}
          app-id: ${{secrets.HUAWEI_APP_ID}}
          file-path: "FzuHelper_7.2.6.726703.app"
          file-name: "FzuHelper_7.2.6.726703.app"
          submit: false
          test-submit: true
          test-group-ids: 3bd3c58f77f844a7abeb2b4deadfa94a,5750d1361e784f699b4113f72a98d3fa
          test-desc: 工作流自动发布
          version-desc: "FzuHelper_7.2.6.726703.app"
          
